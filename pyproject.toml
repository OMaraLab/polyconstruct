[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyconstruct"
version = "1.0"
description = "Python libraries for constructing polymer topologies and coordinates from monomers for molecular dynamics simulation with GROMACS"
authors = [{name = "Luna Morrow", email = "uqlmorro@uq.edu.au"}, ]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }

# Dependencies required for your project
dependencies = [
    "numpy==2.2.6",
    "MDAnalysis==2.9.0",
    "click==8.3.0",
    "py3Dmol==2.5.2",
    "rdkit==2025.3.6",
    "networkx==3.4.2",
    "pandas==2.3.2",
    "tqdm==4.67.1"
]

[tool.setuptools]
packages = ["polybuild", "polybuild.polybuild", "polyconf", "polyconf.polyconf", "polytop", "polytop.polytop"]

[tool.setuptools.package-dir]
polybuild.polybuild = "polybuild"
polyconf.polyconf = "polyconf"
polytop.polytop = "polytop"